# Blueprint: https://render.com/docs/blueprint-spec
# Free web services cannot attach a disk. This app keeps SQLite and photos on
# local disk, so the blueprint uses the smallest paid instance. To run free,
# set plan: free and delete the disk block — reports and uploads will vanish
# whenever the instance sleeps or redeploys.
services:
  - type: web
    name: civic-issue-tracker
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: EMAIL_BACKEND
        value: console
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_EMAIL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: STAFF_DEPARTMENT
        value: Other
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/instance/civic.db
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/instance/uploads
    disk:
      name: civic-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
